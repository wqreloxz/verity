<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Чна</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #000;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
  }

  .section {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 2rem;
    text-align: center;
  }

  h1 {
    font-size: clamp(2rem, 8vw, 5rem);
    font-weight: 400;
    letter-spacing: 0.02em;
    animation: fadeIn 1.5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  /* Экран со смайликами */
  #smileys {
    position: fixed;
    inset: 0;
    background: #fff;
    display: none;
    overflow: hidden;
    z-index: 100;
  }

  #smileys.active { display: block; }

  .smiley {
    position: absolute;
    width: 60px;
    height: 60px;
    animation: fall linear forwards;
  }

  @keyframes fall {
    from { transform: translateY(-100px) rotate(0deg); }
    to { transform: translateY(110vh) rotate(360deg); }
  }

  /* Финальный экран */
  #final {
    position: fixed;
    inset: 0;
    background: #000;
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 300;
  }

  #final.active { display: flex; }

  #final h2 {
    font-size: clamp(2rem, 10vw, 6rem);
    font-weight: 400;
    color: #fff;
    letter-spacing: 0.05em;
    animation: fadeIn 1.2s ease;
  }
</style>
</head>
<body>

  <!-- Первый экран -->
  <div class="section">
    <h1>Чна</h1>
  </div>

  <!-- Пустой экран для скролла, чтобы долистать до конца -->
  <div class="section"></div>

  <!-- Экран со смайликами -->
  <div id="smileys"></div>

  <!-- Финальный экран -->
  <div id="final">
    <h2>жырітi,ну ты чаго пупс заплакала</h2>
  </div>

<script>
  const smileysEl = document.getElementById('smileys');
  const finalEl = document.getElementById('final');
  let triggered = false;

  function createSmiley() {
    const svg = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    svg.setAttribute('viewBox', '0 0 100 100');
    svg.classList.add('smiley');

    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', '50');
    circle.setAttribute('cy', '50');
    circle.setAttribute('r', '45');
    circle.setAttribute('fill', '#FFD700');
    circle.setAttribute('stroke', '#000');
    circle.setAttribute('stroke-width', '3');
    svg.appendChild(circle);

    [-18, 18].forEach(x => {
      const eye = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
      eye.setAttribute('cx', 50 + x);
      eye.setAttribute('cy', '38');
      eye.setAttribute('r', '6');
      eye.setAttribute('fill', '#000');
      svg.appendChild(eye);
    });

    const mouth = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    mouth.setAttribute('d', 'M 30 58 Q 50 82 70 58');
    mouth.setAttribute('stroke', '#000');
    mouth.setAttribute('stroke-width', '5');
    mouth.setAttribute('fill', 'none');
    mouth.setAttribute('stroke-linecap', 'round');
    svg.appendChild(mouth);

    return svg;
  }

  function launchSmileys() {
    if (triggered) return;
    triggered = true;

    smileysEl.classList.add('active');

    // Смайлики падают и ОСТАЮТСЯ на экране (не исчезают)
    const count = 45;
    for (let i = 0; i < count; i++) {
      setTimeout(() => {
        const s = createSmiley();
        s.style.left = Math.random() * 95 + 'vw';
        s.style.top = Math.random() * 90 + 'vh';
        s.style.width = (40 + Math.random() * 60) + 'px';
        s.style.height = s.style.width;
        smileysEl.appendChild(s);
      }, i * 70);
    }
  }

  // При скролле: показываем смайлики, а в самом конце — финал
  function checkScroll() {
    const scrollBottom = window.scrollY + window.innerHeight;
    const docHeight = document.documentElement.scrollHeight;

    // Когда долистали до конца документа
    if (scrollBottom >= docHeight - 5) {
      finalEl.classList.add('active');
      smileysEl.style.display = 'none';
    } else if (!triggered) {
      // Начали скроллить — запускаем смайлики
      launchSmileys();
    }
  }

  window.addEventListener('scroll', checkScroll);
  checkScroll();
</script>
</body>
</html>
